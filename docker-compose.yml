# Local development for the backend only. The frontend is a static Vite
# app (that's what ships to Vercel) — run it directly with `npm run dev`
# in ./frontend rather than through Docker; see the README.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - reading-room-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  reading-room-data:
